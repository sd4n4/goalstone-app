<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/goalpages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+GB+S:ital,wght@0,100..400;1,100..400&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <script src="goalSubmission.js" defer></script>
    <title>Goalstone App</title>
</head>
<body>
    <header> <!--Header including name and nav links-->
        <h2><img src="goalstone.png" alt=""></h2> 
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="career.html">CAREER</a></li>
                <li><a href="health.html">HEALTH</a></li>
                <li><a href="academic.html">ACADEMIC</a></li>
                <li><a href="personal.html">PERSONAL</a></li>
            </ul>
        </nav>
    </header>
    <aside>
        <form id= "goalForm" method="GET">
            <fieldset>
                <legend>ADD GOAL</legend>
                <div>
                    <input id="title"type="text" name="title" placeholder="Goal Title" required>
                </div>
                <div>
                    <input id="time"type="text" name="time" list="times" value="" required placeholder="Enter time frame"> <br>
                    <datalist id="times">
                        <option value="10 years">
                        <option value="5 years">
                        <option value="1 year">
                        <option value="1 month">
                    </datalist>
                </div>
                <div id="button">
                    <input type="submit" class="button" value="GENERATE ROADMAP"> 
                    <input type="reset" class="button" value="CLEAR">
                </div>
            </fieldset>
        </form>
    </aside>
    <article>
        <div id="roadmap"></div>
    </article>
    </body>
    </html>
